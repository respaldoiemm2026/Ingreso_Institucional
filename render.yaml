# Blueprint de Render (New > Blueprint). Las variables con sync: false se cargan a mano en el panel.
services:
  - type: web
    name: ingreso-institucional
    runtime: node
    rootDir: express-main-grupo_yori
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SAMESITE
        value: lax
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # URL de Neon (postgresql://...?sslmode=require)
      - key: CORS_ORIGIN
        sync: false # https://tu-app.vercel.app,https://tu-app-*.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
